<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Report Item</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1>Report a Lost or Found Item</h1>
    <form action="/report" method="POST" class="mt-4">
        <div class="mb-3">
            <label class="form-label">Title (e.g., Blue Casio Calculator)</label>
            <input type="text" name="title" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Category</label>
            <select name="category" class="form-select">
                <option value="Electronics">Electronics</option>
                <option value="Books/Stationery">Books/Stationery</option>
                <option value="Keys/IDs">Keys/IDs</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Description (Be specific!)</label>
            <textarea name="description" class="form-control" rows="3" required></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Location</label>
            <input type="text" name="location" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
                <option value="Lost">I Lost This</option>
                <option value="Found">I Found This</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Submit Report</button>
        <a href="/" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
