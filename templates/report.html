<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Report Item</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="mb-4 text-primary">Report a Lost or Found Item</h2>
        <form action="/report" method="POST">
            <div class="mb-3">
                <label class="form-label">Item Title</label>
                <input type="text" name="title" class="form-control" placeholder="e.g. Blue Casio Calculator" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Category</label>
                <select name="category" class="form-select">
                    <option value="Electronics">Electronics</option>
                    <option value="Books/Stationery">Books/Stationery</option>
                    <option value="Keys/IDs">Keys/IDs</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3" placeholder="Describe unique marks, color, etc." required></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Location</label>
                <input type="text" name="location" class="form-control" placeholder="e.g. Library, Room 402" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    <option value="Lost">Lost This</option>
                    <option value="Found">Found This</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">Submit Report</button>
            <a href="/" class="btn btn-link w-100 mt-2">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
