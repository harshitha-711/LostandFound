<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>College Lost & Found</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">College Lost & Found Portal</span>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <form action="/" method="GET" class="mb-4 d-flex">
    <input type="text" name="search" class="form-control me-2" placeholder="Search for items (e.g. 'bottle')...">
    <button type="submit" class="btn btn-outline-primary">Search</button>
    <a href="/" class="btn btn-outline-secondary ms-2">Reset</a>
</form>
            <h2>Recent Items</h2>
            <a href="/report" class="btn btn-primary">Report New Item</a>
        </div>

        <div class="row">
            {% for item in items %}
            <div class="col-md-4 mb-3">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <span class="badge {% if item.status == 'Found' %}bg-success{% else %}bg-danger{% endif %} mb-2">
                            {{ item.status }}
                        </span>
                        <h5 class="card-title">{{ item.title }}</h5>
                        <h6 class="card-subtitle mb-2 text-muted">{{ item.category }}</h6>
                        <p class="card-text">{{ item.description }}</p>
                    </div>
                    <div class="card-footer text-muted small">
                        📍 Location: {{ item.location }}
                    </div>
                </div>
            </div>
            {% else %}
            <div class="col-12 text-center mt-5">
                <p class="lead">No items reported yet. Be the first!</p>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
